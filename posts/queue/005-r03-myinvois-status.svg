<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B16"/><stop offset="1" stop-color="#0E1730"/></linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.5"><stop offset="0" stop-color="#2F6BFF" stop-opacity="0.35"/><stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity="0.5"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.06"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#dots)"/><rect width="1200" height="630" fill="url(#glow)"/>
  <g transform="translate(72,92)"><rect width="232" height="36" rx="18" fill="#2F6BFF" fill-opacity="0.15" stroke="#8FB2FF" stroke-opacity="0.45"/>
    <circle cx="22" cy="18" r="5" fill="#8FB2FF"/>
    <text x="36" y="24" font-size="15" font-weight="700" fill="#8FB2FF" letter-spacing="1.5">REPORTS · MYINVOIS</text>
    <text y="104" font-size="50" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Submitted ≠ validated.</text>
    <text y="164" font-size="50" font-weight="800" fill="#8FB2FF" letter-spacing="-1.5">Know every status.</text>
    <text y="220" font-size="21" fill="#94A3B8">See the e-Invoice status of every document</text>
    <text y="252" font-size="21" fill="#94A3B8">in one report, not one by one.</text>
  </g>
  <g transform="translate(690,80)">
    <g filter="url(#shadow)">
    <rect width="430" height="190" rx="22" fill="#EF4444" fill-opacity="0.10" stroke="#EF4444" stroke-opacity="0.5"/>
    <text x="28" y="44" font-size="14" font-weight="800" fill="#FCA5A5" letter-spacing="1.5">MYTH</text>
    <text x="28" y="88" font-size="21" font-weight="700" fill="#FFFFFF">"We sent it to MyInvois,</text>
    <text x="28" y="118" font-size="21" font-weight="700" fill="#FFFFFF">so it's done."</text>
    <text x="28" y="160" font-size="15" fill="#FECACA">Some documents get rejected, and nobody checks.</text>
    </g>
    <g transform="translate(0,220)" filter="url(#shadow)">
    <rect width="430" height="210" rx="22" fill="#2F6BFF" fill-opacity="0.14" stroke="#8FB2FF" stroke-opacity="0.5"/>
    <text x="28" y="44" font-size="14" font-weight="800" fill="#8FB2FF" letter-spacing="1.5">FACT</text>
    <text x="28" y="88" font-size="21" font-weight="700" fill="#FFFFFF">Check the status of every</text>
    <text x="28" y="118" font-size="21" font-weight="700" fill="#FFFFFF">document in one place.</text>
    <rect x="28" y="146" width="110" height="34" rx="17" fill="#22C55E" fill-opacity="0.18"/><text x="83" y="169" font-size="14" font-weight="700" fill="#86EFAC" text-anchor="middle">Valid</text>
    <rect x="148" y="146" width="120" height="34" rx="17" fill="#EF4444" fill-opacity="0.18"/><text x="208" y="169" font-size="14" font-weight="700" fill="#FCA5A5" text-anchor="middle">Rejected</text>
    <rect x="278" y="146" width="124" height="34" rx="17" fill="#F59E0B" fill-opacity="0.18"/><text x="340" y="169" font-size="14" font-weight="700" fill="#FCD34D" text-anchor="middle">Pending</text>
    </g>
  </g>
  <g transform="translate(72,560)"><svg width="40" height="40" viewBox="0 0 128 128"><rect x="14" y="26" width="68" height="20" rx="10" fill="#2F6BFF"/><rect x="30" y="54" width="68" height="20" rx="10" fill="#2F6BFF"/><rect x="46" y="82" width="68" height="20" rx="10" fill="#8FB2FF"/></svg>
    <text x="48" y="28" font-size="20" font-weight="800" fill="#FFFFFF">SQL Flow</text>
    <text x="152" y="28" font-size="16" fill="#64748B">sqlaccountingapi.com</text></g>
</svg>
