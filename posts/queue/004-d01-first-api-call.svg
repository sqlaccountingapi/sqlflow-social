<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B16"/><stop offset="1" stop-color="#0E1730"/></linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.5"><stop offset="0" stop-color="#2F6BFF" stop-opacity="0.35"/><stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity="0.5"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.06"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#dots)"/><rect width="1200" height="630" fill="url(#glow)"/>
  <g transform="translate(72,92)"><rect width="324" height="36" rx="18" fill="#2F6BFF" fill-opacity="0.15" stroke="#8FB2FF" stroke-opacity="0.45"/>
    <circle cx="22" cy="18" r="5" fill="#8FB2FF"/>
    <text x="36" y="24" font-size="15" font-weight="700" fill="#8FB2FF" letter-spacing="1.5">DEV TIPS · GETTING STARTED</text>
    <text y="104" font-size="50" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Your first API call</text>
    <text y="164" font-size="50" font-weight="800" fill="#8FB2FF" letter-spacing="-1.5">in one afternoon.</text>
    <text y="220" font-size="21" fill="#94A3B8">Four steps from install to real JSON</text>
    <text y="252" font-size="21" fill="#94A3B8">from SQL Account.</text>
  </g>
  <g transform="translate(620,80)" filter="url(#shadow)" font-family="'JetBrains Mono', Menlo, monospace">
    <rect width="510" height="420" rx="20" fill="#0B1220" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <rect width="510" height="44" rx="20" fill="#FFFFFF" fill-opacity="0.04"/>
    <circle cx="28" cy="22" r="6" fill="#EF4444"/><circle cx="50" cy="22" r="6" fill="#F59E0B"/><circle cx="72" cy="22" r="6" fill="#22C55E"/>
    <text x="255" y="27" font-size="13" fill="#64748B" text-anchor="middle">terminal</text>
    <text x="28" y="96" font-size="16" fill="#64748B"># 1. Install SQL Flow on the SQL Account PC</text>
    <text x="28" y="130" font-size="16" fill="#64748B"># 2. Create an API token in the console</text>
    <text x="28" y="164" font-size="16" fill="#64748B"># 3. Make your first call</text>
    <text x="28" y="198" font-size="16" fill="#E2E8F0">curl https://&lt;your-host&gt;/salesinvoice \</text>
    <text x="28" y="232" font-size="16" fill="#8FB2FF">  -H "Authorization: Bearer $TOKEN"</text>
    <text x="28" y="300" font-size="16" fill="#64748B"># 4. JSON back from your own books</text>
    <text x="28" y="334" font-size="16" fill="#86EFAC">[{ "DocNo": "IV-00841", "Amount": 7350 }]</text>
  </g>
  <g transform="translate(72,560)"><svg width="40" height="40" viewBox="0 0 128 128"><rect x="14" y="26" width="68" height="20" rx="10" fill="#2F6BFF"/><rect x="30" y="54" width="68" height="20" rx="10" fill="#2F6BFF"/><rect x="46" y="82" width="68" height="20" rx="10" fill="#8FB2FF"/></svg>
    <text x="48" y="28" font-size="20" font-weight="800" fill="#FFFFFF">SQL Flow</text>
    <text x="152" y="28" font-size="16" fill="#64748B">sqlaccountingapi.com</text></g>
</svg>
