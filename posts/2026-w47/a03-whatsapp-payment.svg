<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0B"/><stop offset="1" stop-color="#101826"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.28"/><stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2433"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g transform="translate(72,92)">
    <rect width="214" height="36" rx="18" fill="#22C55E" fill-opacity="0.14" stroke="#22C55E" stroke-opacity="0.4"/>
    <circle cx="22" cy="18" r="5" fill="#22C55E"/>
    <text x="36" y="24" font-size="15" font-weight="700" fill="#4ADE80" letter-spacing="1.5">ASSISTANT · WHATSAPP</text>
    <text y="104" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Collect on the road.</text>
    <text y="168" font-size="54" font-weight="800" fill="#4ADE80" letter-spacing="-1.5">Post with a PIN.</text>
    <text y="226" font-size="22" fill="#9CA3AF">Staff message a payment. SQL Flow drafts it,</text>
    <text y="258" font-size="22" fill="#9CA3AF">knocks off the invoice, and waits for your OK.</text>
    <g transform="translate(0,310)" font-size="17" font-weight="600" fill="#E5E7EB">
      <rect width="150" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="18" y="26">✓ Role limits</text>
      <rect x="164" width="128" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="182" y="26">✓ PIN to post</text>
      <rect x="306" width="140" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="324" y="26">✓ Audit trail</text>
    </g>
  </g>

  <g transform="translate(760,40)" filter="url(#shadow)">
    <rect width="340" height="560" rx="44" fill="url(#phone)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
    <rect x="130" y="16" width="80" height="22" rx="11" fill="#0A0A0B"/>
    <rect x="14" y="50" width="312" height="56" rx="14" fill="#FFFFFF" fill-opacity="0.04"/>
    <circle cx="44" cy="78" r="17" fill="#22C55E"/>
    <text x="44" y="84" font-size="15" font-weight="800" fill="#0A0A0B" text-anchor="middle">SF</text>
    <text x="72" y="74" font-size="15" font-weight="700" fill="#FFFFFF">SQL Flow · Demo Trading</text>
    <text x="72" y="93" font-size="12" fill="#4ADE80">online</text>
    <rect x="70" y="122" width="250" height="70" rx="16" fill="#166534"/>
    <text x="86" y="150" font-size="14" fill="#ECFDF5">Kedai Maju paid RM 5,000</text>
    <text x="86" y="172" font-size="14" fill="#ECFDF5">by transfer for IV-00841</text>
    <rect x="20" y="208" width="280" height="226" rx="16" fill="#1F2937" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="36" y="236" font-size="12" font-weight="700" fill="#9CA3AF" letter-spacing="1">DRAFT · CUSTOMER PAYMENT</text>
    <text x="36" y="264" font-size="16" font-weight="700" fill="#FFFFFF">Kedai Maju Sdn Bhd</text>
    <text x="36" y="300" font-size="30" font-weight="800" fill="#FFFFFF">RM 5,000.00</text>
    <line x1="36" y1="318" x2="284" y2="318" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="36" y="342" font-size="13" fill="#9CA3AF">Knocks off IV-00841</text>
    <text x="284" y="342" font-size="13" fill="#E5E7EB" text-anchor="end">RM 7,350 → 2,350</text>
    <rect x="36" y="362" width="160" height="50" rx="12" fill="#22C55E"/>
    <text x="116" y="393" font-size="15" font-weight="800" fill="#052E16" text-anchor="middle">Confirm &amp; post</text>
    <rect x="206" y="362" width="78" height="50" rx="12" fill="#FFFFFF" fill-opacity="0.06"/>
    <text x="245" y="393" font-size="14" font-weight="600" fill="#D1D5DB" text-anchor="middle">Cancel</text>
    <rect x="20" y="450" width="280" height="62" rx="16" fill="#22C55E" fill-opacity="0.12" stroke="#22C55E" stroke-opacity="0.35"/>
    <circle cx="46" cy="481" r="12" fill="#22C55E"/>
    <path d="M40 481 l4 4 l8 -8" stroke="#052E16" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="476" font-size="13" font-weight="700" fill="#4ADE80">Posted · OR-00552</text>
    <text x="68" y="495" font-size="12" fill="#A7F3D0">Confirmed with PIN by Aisyah</text>
  </g>

  <g transform="translate(72,566)">
    <rect width="30" height="30" rx="8" fill="#22C55E"/>
    <path d="M8 19 q7 -12 14 -4" stroke="#0A0A0B" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="42" y="22" font-size="20" font-weight="800" fill="#FFFFFF">SQL Flow</text>
    <text x="146" y="22" font-size="16" fill="#6B7280">sqlaccountingapi.com</text>
  </g>
</svg>
