<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B16"/><stop offset="1" stop-color="#0E1730"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0.2" cy="0.75" r="0.45">
      <stop offset="0" stop-color="#EF4444" stop-opacity="0.16"/><stop offset="1" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.8" cy="0.75" r="0.45">
      <stop offset="0" stop-color="#2F6BFF" stop-opacity="0.32"/><stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowR)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <text x="600" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#8FB2FF" letter-spacing="2">SAFE TO AUTOMATE · IDEMPOTENCY KEYS</text>
  <text x="600" y="138" text-anchor="middle" font-size="50" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Network blinked. Order sent twice.</text>
  <text x="600" y="194" text-anchor="middle" font-size="50" font-weight="800" fill="#8FB2FF" letter-spacing="-1.5">Invoiced once.</text>

  <g transform="translate(80,236)" filter="url(#sh)">
    <rect width="490" height="290" rx="22" fill="#131B2E" stroke="#EF4444" stroke-opacity="0.35"/>
    <rect x="24" y="22" width="122" height="30" rx="15" fill="#EF4444" fill-opacity="0.15"/>
    <text x="85" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#FCA5A5" letter-spacing="1">WITHOUT</text>
    <g font-size="15" fill="#CBD5E1">
      <rect x="24" y="72" width="442" height="52" rx="12" fill="#FFFFFF" fill-opacity="0.04"/>
      <text x="44" y="104" font-family="'JetBrains Mono', Menlo, monospace">POST /salesinvoice  order-10482</text>
      <text x="446" y="104" text-anchor="end" font-weight="700" fill="#FCA5A5">IV-01041</text>
      <rect x="24" y="134" width="442" height="52" rx="12" fill="#FFFFFF" fill-opacity="0.04"/>
      <text x="44" y="166" font-family="'JetBrains Mono', Menlo, monospace">POST /salesinvoice  order-10482</text>
      <text x="446" y="166" text-anchor="end" font-weight="700" fill="#FCA5A5">IV-01042</text>
    </g>
    <circle cx="44" cy="238" r="14" fill="#EF4444"/>
    <path d="M38 232 l12 12 M50 232 l-12 12" stroke="#1F0A0A" stroke-width="3" stroke-linecap="round"/>
    <text x="70" y="235" font-size="17" font-weight="700" fill="#FFFFFF">Duplicate invoice</text>
    <text x="70" y="257" font-size="14" fill="#94A3B8">Customer billed RM 240 twice</text>
  </g>

  <g transform="translate(600,381)">
    <circle r="26" fill="#070B16" stroke="#8FB2FF" stroke-opacity="0.3"/>
    <path d="M-9 0 H9 M3 -7 L10 0 L3 7" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(630,236)" filter="url(#sh)">
    <rect width="490" height="290" rx="22" fill="#131B2E" stroke="#2F6BFF" stroke-opacity="0.6"/>
    <rect x="24" y="22" width="232" height="30" rx="15" fill="#2F6BFF" fill-opacity="0.2"/>
    <text x="140" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#8FB2FF" letter-spacing="1">WITH IDEMPOTENCY-KEY</text>
    <g font-size="15" fill="#CBD5E1">
      <rect x="24" y="72" width="442" height="52" rx="12" fill="#FFFFFF" fill-opacity="0.04"/>
      <text x="44" y="104" font-family="'JetBrains Mono', Menlo, monospace">Key: order-10482</text>
      <text x="446" y="104" text-anchor="end" font-weight="700" fill="#8FB2FF">IV-01041 posted</text>
      <rect x="24" y="134" width="442" height="52" rx="12" fill="#FFFFFF" fill-opacity="0.04"/>
      <text x="44" y="166" font-family="'JetBrains Mono', Menlo, monospace">Key: order-10482 (retry)</text>
      <text x="446" y="166" text-anchor="end" font-weight="700" fill="#C7D7FF">same result</text>
    </g>
    <circle cx="44" cy="238" r="14" fill="#2F6BFF"/>
    <path d="M37 238 l5 5 l9 -10" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="235" font-size="17" font-weight="700" fill="#FFFFFF">One invoice. Always.</text>
    <text x="70" y="257" font-size="14" fill="#94A3B8">Retries return the stored result</text>
  </g>

  <g transform="translate(80,560)">
    <svg width="40" height="40" viewBox="0 0 128 128"><rect x="14" y="26" width="68" height="20" rx="10" fill="#2F6BFF"/><rect x="30" y="54" width="68" height="20" rx="10" fill="#2F6BFF"/><rect x="46" y="82" width="68" height="20" rx="10" fill="#8FB2FF"/></svg>
    <text x="48" y="28" font-size="20" font-weight="800" fill="#FFFFFF">SQL Flow</text>
    <text x="152" y="28" font-size="16" fill="#64748B">The local REST API for SQL Accounting</text>
  </g>
  <text x="1120" y="588" text-anchor="end" font-size="16" fill="#64748B">sqlaccountingapi.com</text>
</svg>
